<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>角色分层动态演示</title>
<style>
:root{--ink:#283c61;--muted:#70809e;--blue:#567cc9;--border:#dfe7f5;--paper:#fff;--bg:#f5f7fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;font-size:14px}button,input,select{font:inherit}button{cursor:pointer;color:inherit;border:1px solid var(--border);background:#fff;transition:background .15s,border-color .15s,transform .15s}button:hover{border-color:#88a5de;background:#f3f7ff}button:active{transform:scale(.98)}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #8db4f0;outline-offset:3px}button:disabled{opacity:.45;cursor:not-allowed}header{height:76px;max-width:1440px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:0 36px;gap:16px}.brand{display:flex;align-items:center;gap:12px}.brand svg{width:36px;height:36px}.brand b{font-size:20px;letter-spacing:2px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:3px;margin-top:4px}.local-badge{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}.dot{width:6px;height:6px;border-radius:50%;background:#69a58c}.app{max-width:1440px;margin:auto;display:grid;grid-template-columns:minmax(420px,1fr) 336px;gap:24px;padding:0 36px 28px}.stage-card{position:relative;border:1px solid var(--border);border-radius:24px;overflow:hidden;min-height:720px;height:calc(100vh - 110px);background:#e8eefb;box-shadow:0 16px 50px #5269a00c}.stage-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 45% 30%,#ffffff 0%,#f0f5ff 42%,#dde7fb 100%);transition:background .3s}.stage-bg.cream{background:radial-gradient(ellipse at 45% 30%,#fffdf9 0%,#fff1e5 100%)}.stage-bg.dark{background:radial-gradient(ellipse at 45% 30%,#425472 0%,#1d2a40 100%)}.stage-bg.check{background:conic-gradient(#e4e8ef 25%,#f6f8fc 0 50%,#e4e8ef 0 75%,#f6f8fc 0);background-size:24px 24px}.decor-circle{position:absolute;width:78%;aspect-ratio:1;border:1px solid #ffffffa6;border-radius:50%;left:11%;top:10%;pointer-events:none}.decor-circle:after{content:"";position:absolute;inset:26px;border:1px dashed #9eafd632;border-radius:50%}#stage{position:absolute;width:100%;height:100%;inset:0;touch-action:none;cursor:crosshair}#fallback{position:absolute;inset:4%;width:92%;height:92%;object-fit:contain;display:none}.stage-top{position:absolute;top:23px;left:24px;right:24px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.stage-top h1{font-size:15px;font-weight:500;letter-spacing:2px;margin:0 0 5px}.stage-top p{margin:0;font-size:11px;color:var(--muted)}.stage-state{background:#ffffffcd;border:1px solid #fff;border-radius:99px;padding:7px 11px;font-size:11px;letter-spacing:1px;color:#526987}.stage-bottom{position:absolute;bottom:20px;left:24px;right:24px;display:flex;justify-content:space-between;align-items:end;gap:12px}.views{display:flex;padding:4px;border:1px solid #fff;background:#ffffffcb;border-radius:12px;gap:3px;backdrop-filter:blur(8px)}.views button{border:0;background:transparent;padding:8px 13px;font-size:12px;border-radius:8px}.views button[aria-pressed=true]{color:var(--blue);background:#e8effc}.hint{color:#6e7e9a;font-size:11px;background:#ffffffe0;padding:9px 12px;border-radius:10px;max-width:200px}.side{display:flex;flex-direction:column;gap:16px}.intro{padding:5px 4px 1px}.intro .eyebrow{font-size:10px;letter-spacing:3px;color:#8395b6}.intro h2{font-size:24px;font-weight:500;letter-spacing:1px;margin:10px 0 8px}.intro p{font-size:12px;color:var(--muted);line-height:1.7;margin:0}.panel{border-radius:18px;background:var(--paper);border:1px solid var(--border);padding:19px 19px 18px}.panel h3{font-size:13px;letter-spacing:1px;margin:0 0 15px;display:flex;justify-content:space-between;align-items:center}.panel h3 span{font-size:10px;font-weight:400;letter-spacing:1px;color:#8c9cba}.expressions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.expression{border-radius:11px;padding:9px 4px 8px;font-size:11px;display:flex;align-items:center;gap:4px;flex-direction:column}.expression img{width:52px;height:52px;object-fit:contain;border-radius:50%;background:#eef3fe}.expression[aria-pressed=true],.outfit[aria-pressed=true]{border-color:#7396d8;background:#edf3ff;color:#496cae;box-shadow:inset 0 0 0 1px #7396d8}.outfits{display:flex;gap:7px}.outfit{flex:1;font-size:11px;border-radius:9px;padding:11px 3px}.motion-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 6px}.motion-grid label{display:flex;align-items:center;gap:7px;font-size:12px;cursor:pointer}.motion-grid input{appearance:none;margin:0;width:27px;height:16px;border-radius:12px;background:#dce3ef;position:relative;transition:background .2s;cursor:pointer}.motion-grid input:checked{background:#7295d5}.motion-grid input:before{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;background:#fff;box-shadow:0 1px 2px #0002;border-radius:50%;transition:transform .2s}.motion-grid input:checked:before{transform:translateX(11px)}.range-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:19px}.range-label output{font-variant-numeric:tabular-nums}input[type=range]{accent-color:#7295d5;width:100%;margin:10px 0 3px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.actions button{font-size:12px;padding:10px 5px;border-radius:9px}.palette{display:flex;gap:8px;align-items:center;margin-top:16px;font-size:11px;color:var(--muted)}.swatch{width:21px;height:21px;padding:0;border-radius:50%;border:2px solid #fff;outline:1px solid #d5dfef}.swatch[aria-pressed=true]{outline:2px solid #6686c1;outline-offset:2px}.swatch.blue{background:#dce7ff}.swatch.cream{background:#ffe9d4}.swatch.dark{background:#25344c}.swatch.check{background:conic-gradient(#bec8d9 25%,white 0 50%,#bec8d9 0 75%,white 0);background-size:8px 8px}.download{width:100%;padding:14px;border-radius:12px;background:#5e80c4;color:white;border-color:transparent;font-size:13px;letter-spacing:1px;box-shadow:0 6px 18px #5e80c422}.download:hover{background:#4d70b4;color:#fff}.subactions{display:flex;gap:8px;margin-top:9px}.subactions button{flex:1;border-radius:10px;padding:9px;font-size:11px}.note{font-size:11px;line-height:1.7;color:#8a96ac;text-align:center;margin:11px 5px 0}.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#2f405bec;color:white;border-radius:12px;padding:13px 22px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .2s;z-index:10;max-width:90vw;text-align:center}.toast.show{opacity:1}.loading{position:absolute;inset:0;display:grid;place-content:center;color:#7185a8;font-size:13px;background:#f0f4fc;z-index:3}.loading[hidden]{display:none}.dark-mode .stage-top{color:#f3f6ff}.dark-mode .stage-top p{color:#b5c4df}@media(max-width:940px){header{padding:0 18px;height:66px}.app{padding:0 16px 22px;gap:16px;grid-template-columns:minmax(280px,1fr) 310px}.stage-card{min-height:700px;height:calc(100vh - 90px)}.panel{padding:16px}.hint{display:none}.intro h2{font-size:22px}}@media(max-width:680px){header{height:64px}.brand b{font-size:17px}.brand small{font-size:8px}.local-badge{font-size:10px}.app{display:flex;flex-direction:column;padding:0 12px 20px}.stage-card{height:68vh;min-height:460px;max-height:800px;border-radius:20px}.side{display:grid;grid-template-columns:1fr 1fr;gap:12px}.intro{grid-column:1/-1;padding:4px}.intro h2{font-size:21px;margin:5px 0}.intro p{display:none}.side>.panel:first-of-type{grid-column:1/-1}.expressions{grid-template-columns:repeat(6,1fr);gap:5px}.expression{font-size:10px}.expression img{width:38px;height:38px}.outfits{flex-direction:column;gap:6px}.outfit{padding:9px}.motion-grid{grid-template-columns:1fr;gap:10px}.panel{padding:14px}.stage-top{left:18px;right:18px;top:18px}.stage-bottom{left:16px;right:16px;bottom:16px}.motion-panel{grid-column:2;grid-row:3/5}.exports{grid-column:1}.range-label{margin-top:14px}.actions{grid-template-columns:1fr}.note{grid-column:1/-1;text-align:left}.palette{flex-wrap:wrap;margin-top:13px;gap:9px}.panel h3 span{display:none}}
</style>
</head>
<body>
<header><div class="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><g fill="#adc5ef"><ellipse cx="20" cy="10" rx="5" ry="9"/><ellipse cx="20" cy="30" rx="5" ry="9"/><ellipse cx="10" cy="20" rx="9" ry="5"/><ellipse cx="30" cy="20" rx="9" ry="5"/><ellipse cx="13" cy="13" rx="5" ry="8" transform="rotate(-45 13 13)"/><ellipse cx="27" cy="27" rx="5" ry="8" transform="rotate(-45 27 27)"/><ellipse cx="27" cy="13" rx="5" ry="8" transform="rotate(45 27 13)"/><ellipse cx="13" cy="27" rx="5" ry="8" transform="rotate(45 13 27)"/></g><circle cx="20" cy="20" r="6" fill="#efd9a0"/></svg><div><b>角色动态工坊</b><small>表情 · 衣装 · 微小的心情</small></div></div><div class="local-badge"><i class="dot"></i>离线可用 · 素材已内置</div></header>
<main class="app">
 <section class="stage-card" id="stageCard" aria-label="角色动态预览">
  <div class="stage-bg" id="stageBg"></div><div class="decor-circle"></div>
  <canvas id="stage" aria-label="带有眨眼、呼吸和发丝摆动的角色预览"></canvas><img id="fallback" alt="当前表情与服装的角色立绘">
  <div class="stage-top"><div><h1>一朵蓝色的小心情</h1><p>移动鼠标，和她打个招呼</p></div><span class="stage-state" id="stateBadge">准备中</span></div>
  <div class="stage-bottom"><div class="views" aria-label="预览视角"><button data-view="full" aria-pressed="true">全身</button><button data-view="bust" aria-pressed="false">半身</button><button data-view="face" aria-pressed="false">表情</button></div><span class="hint">点一下角色，会轻轻点头</span></div>
  <div class="loading" id="loading" role="status">正在整理她的小心情…</div>
 </section>
 <aside class="side">
  <div class="intro"><span class="eyebrow">可自由组合的角色差分</span><h2>今天，是什么心情？</h2><p>六种表情，三种穿搭。<br>选一个喜欢的组合，让画面慢慢呼吸。</p></div>
  <section class="panel"><h3>表情差分 <span>01 / 表情</span></h3><div class="expressions" id="expressionButtons"></div></section>
  <section class="panel"><h3>袜装差分 <span>02 / 服装</span></h3><div class="outfits"><button class="outfit" data-outfit="original" aria-pressed="true">原装</button><button class="outfit" data-outfit="overknee" aria-pressed="false">过膝白丝</button><button class="outfit" data-outfit="tights" aria-pressed="false">白色裤袜</button></div><div class="palette"><span>背景</span><button class="swatch blue" data-bg="blue" aria-label="浅蓝背景" aria-pressed="true"></button><button class="swatch cream" data-bg="cream" aria-label="奶油背景" aria-pressed="false"></button><button class="swatch dark" data-bg="dark" aria-label="深色背景" aria-pressed="false"></button><button class="swatch check" data-bg="check" aria-label="透明网格背景" aria-pressed="false"></button></div></section>
  <section class="panel motion-panel"><h3>动态设置 <span>03 / 动作</span></h3><div class="motion-grid"><label><input type="checkbox" id="blink" checked>自动眨眼</label><label><input type="checkbox" id="breathe" checked>呼吸起伏</label><label><input type="checkbox" id="hair" checked>发梢轻摆</label><label><input type="checkbox" id="follow" checked>头部跟随</label><label><input type="checkbox" id="talk">口型演示</label><label><input type="checkbox" id="cycle">表情轮播</label></div><label class="range-label" for="strength"><span>动作幅度</span><output id="strengthValue">60%</output></label><input id="strength" type="range" min="0" max="100" value="60"><div class="actions"><button id="pause">暂停动作</button><button id="wink">眨一下眼</button></div></section>
  <div class="exports"><button class="download" id="export">导出当前差分 PNG ↓</button><div class="subactions"><button id="record">录制 6 秒动画</button><button id="reset">恢复默认</button></div><p class="note">网页分层动态演示。<br>分层 PSD 可继续用于 Cubism 绑定。</p></div>
 </aside>
</main><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>/*__ASSETS__*/</script><script>/*__RUNTIME__*/</script>
</body></html>
