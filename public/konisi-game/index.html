<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>柯妮丝的午后 · 差分互动剧场</title>
<style>
:root{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:#43516e;background:#f2eff9;--pink:#d973ae;--blue:#648ebd;--line:#e3c8df}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 5%,#ffeff9,transparent 54%),linear-gradient(150deg,#e8f2ff,#faf1fa);padding:clamp(8px,2.4vw,28px)}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #5687c5;outline-offset:3px}.shell{max-width:1120px;margin:auto;background:#fffafa;border:1px solid #e6d3e3;border-radius:20px;box-shadow:0 15px 48px #41446524;overflow:hidden}.topbar{background:linear-gradient(96deg,#fde3ef,#dceaff);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-weight:800;font-size:clamp(18px,2.5vw,24px);color:#644d76}.subtitle{color:#697d9d;font-size:12px;margin-top:3px}.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.toolbar button,.toolbar select{border:1px solid #bfb9d9;background:#fffefd;border-radius:9px;padding:8px 11px;font-size:13px;color:#566282}.toolbar button[aria-pressed=true]{background:#d9e9ff}.scene{height:clamp(430px,59vw,620px);position:relative;overflow:hidden;background:linear-gradient(176deg,#c6dfff,#f6e1f6 72%,#f8d6e9);touch-action:pan-y}.scene::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 75% 15%,#ffffff99,transparent 38%),linear-gradient(105deg,transparent 45%,#ffffff40 46%,transparent 49%);pointer-events:none}.scene::after{content:"";position:absolute;inset:auto 0 0;height:21%;background:linear-gradient(transparent,#b594c530);pointer-events:none}.float{position:absolute;background:#ffffffa0;border-radius:70px;filter:blur(1px);animation:drift 13s ease-in-out infinite alternate;pointer-events:none}.f1{width:160px;height:40px;left:4%;top:14%}.f2{width:110px;height:26px;right:8%;top:28%;animation-delay:-5s}.scene-label{position:absolute;z-index:5;top:13px;left:13px;border-radius:99px;padding:7px 12px;background:#ffffffbd;color:#5e6b90;font-size:12px}.hint{position:absolute;z-index:5;top:13px;right:13px;border-radius:8px;padding:7px 10px;background:#ffffffc7;color:#5e6b90;font-size:12px}.character{position:absolute;left:50%;top:-2%;height:175%;aspect-ratio:1024/1536;transform:translateX(calc(-50% + var(--mx,0px))) translateY(var(--step,0px)) rotate(var(--tilt,0deg));transform-origin:50% 22%;transition:transform .22s ease-out;animation:breathe 4.7s ease-in-out infinite;user-select:none;will-change:transform}.character .layer{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none}.face-shift-left{transform:translate(calc(var(--gx,0px) * 1.1), calc(var(--gy,0px) * 1.1))}.face-shift-right{transform:translate(calc(var(--gx,0px) * 1.1), calc(var(--gy,0px) * 1.1))}.character.react{--step:-8px;--tilt:1.1deg}.character.shy{--tilt:-1.8deg}.character.happy{--step:-5px}.character.angry{--tilt:1.5deg}.character.sad{--step:2px}.hit{position:absolute;z-index:4;left:32%;width:36%;top:3%;height:81%;background:transparent;border:0;color:transparent;cursor:pointer}.hit:focus-visible{outline:3px dashed #e386bc;outline-offset:-3px}.scene.full .character{height:98%;top:1%}.scene.full .hit{left:34%;width:32%;height:96%}.scene.full .hint{top:auto;bottom:12px}.dialogue-wrap{position:relative;border-top:3px solid #e7bad6;padding:17px clamp(13px,3vw,25px) 22px;background:linear-gradient(125deg,#fff,#fff5fb);min-height:210px}.speaker{position:absolute;top:-18px;left:20px;border:1px solid #eabbd7;border-radius:11px 11px 4px 4px;background:#fff;padding:6px 15px;font-weight:800;color:#a54c8b;box-shadow:0 3px 12px #9e4b7c21}.dialogue{font-size:clamp(15px,2vw,19px);line-height:1.8;min-height:70px;margin:19px 0 13px;white-space:pre-line}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.choices button{min-height:44px;text-align:left;background:#fff;border:1px solid #e5bed5;border-radius:10px;padding:8px 12px;color:#624d75}.choices button:hover{background:#ffe8f3}.bottom{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;color:#707c97;padding:10px 16px;border-top:1px solid #f1e5f1;background:#fbfaff}.costume-note{margin:0;padding:6px 15px;color:#697b93;background:#f4f7ff;font-size:12px}.screen-reader{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:610px){body{padding:0}.shell{border-radius:0}.choices{grid-template-columns:1fr}.scene{height:460px}.character{height:155%;top:-1%}.hit{left:22%;width:56%}.scene.full .character{height:95%}.topbar{padding:12px}.hint{top:auto;bottom:10px}.toolbar select{max-width:160px}}@keyframes drift{to{transform:translate(32px,15px)}}@keyframes breathe{0%,100%{scale:1}50%{scale:1.003}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="shell">
  <header class="topbar">
    <div>
      <div class="brand">柯妮丝的午后</div>
      <div class="subtitle">雪糕少女汉化组 · Level 1 · 角色差分互动剧场</div>
    </div>
    <div class="toolbar">
      <label for="costume">外观 <span class="screen-reader">服饰差分</span></label>
      <select id="costume">
        <option value="original">原图默认</option>
        <option value="tights">白色裤袜</option>
        <option value="overknee">白色过膝袜</option>
      </select>
      <button id="view" type="button" aria-pressed="false">查看全身</button>
      <button id="follow" type="button" aria-pressed="true">关闭目光跟随</button>
      <button id="restart" type="button">重开故事</button>
    </div>
  </header>
  <section class="scene" id="scene" aria-label="柯妮丝互动场景">
    <span class="float f1"></span><span class="float f2"></span>
    <div class="scene-label">午后 · 书页边的风</div>
    <div class="hint">移动鼠标 · 点击角色 · 选择回应</div>
    <div class="character neutral" id="characterArt" aria-hidden="true">
      <img class="layer" src="新差分素材/角色分层与动态演示/parts/part_leg_left.png" alt="">
      <img class="layer" src="新差分素材/角色分层与动态演示/parts/part_leg_right.png" alt="">
      <img class="layer" id="wardrobeLeft" src="" alt="">
      <img class="layer" id="wardrobeRight" src="" alt="">
      <img class="layer" src="新差分素材/角色分层与动态演示/parts/part_body.png" alt="">
      <img class="layer" src="新差分素材/角色分层与动态演示/parts/part_arm_left.png" alt="">
      <img class="layer" src="新差分素材/角色分层与动态演示/parts/part_arm_right.png" alt="">
      <img class="layer" src="新差分素材/角色分层与动态演示/parts/part_head.png" alt="">
      <img class="layer" id="exprSkin" src="新差分素材/角色分层与动态演示/layers/expressions/neutral/neutral_skin.png" alt="">
      <img class="layer face-shift-left" id="exprEyeLeft" src="新差分素材/角色分层与动态演示/layers/expressions/neutral/neutral_eye_left.png" alt="">
      <img class="layer face-shift-right" id="exprEyeRight" src="新差分素材/角色分层与动态演示/layers/expressions/neutral/neutral_eye_right.png" alt="">
      <img class="layer" id="exprMouth" src="新差分素材/角色分层与动态演示/layers/expressions/neutral/neutral_mouth.png" alt="">
      <img class="layer" src="新差分素材/角色分层与动态演示/parts/part_hair_left.png" alt="">
      <img class="layer" src="新差分素材/角色分层与动态演示/parts/part_hair_right.png" alt="">
    </div>
    <button type="button" class="hit" id="talkHit" aria-label="点击角色并与柯妮丝互动">与柯妮丝交谈</button>
  </section>
  <section class="dialogue-wrap" aria-label="对话区域">
    <div class="speaker" id="speaker">柯妮丝</div>
    <p class="dialogue" id="dialogue" aria-live="polite"></p>
    <div class="choices" id="choices"></div>
  </section>
  <p class="costume-note" id="costumeNote">当前版本已替换为你的自制差分。仅保留原图、白色裤袜、白色过膝袜三套外观，其余旧差分已移除。</p>
  <footer class="bottom"><span id="chapter">第一幕 · 相遇</span><span>完全离线 · 无需登录 · 不调用 Supabase · 全身分层素材保留</span></footer>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const scene=$('scene'),art=$('characterArt'),text=$('dialogue'),choices=$('choices'),chapter=$('chapter');
const exprSkin=$('exprSkin'),exprEyeLeft=$('exprEyeLeft'),exprEyeRight=$('exprEyeRight'),exprMouth=$('exprMouth');
const wardrobeLeft=$('wardrobeLeft'),wardrobeRight=$('wardrobeRight');
const expressionBase='新差分素材/角色分层与动态演示/layers/expressions/';
const wardrobeBase='新差分素材/角色分层与动态演示/layers/wardrobe/';
const costumeLabels={original:'原图默认',tights:'白色裤袜',overknee:'白色过膝袜'};
const expressionNames=['neutral','happy','shy','sad','surprised','angry','blink'];
let current='start',clicks=0,follow=true,blinkTimer=null,talkTimer=null,currentExpr='neutral',currentCostume='original';
const story={
  start:['欢迎回来。我是柯妮丝·摩拉·戈妮娅。午后的风有点轻，我总觉得书页边也在悄悄说话。今天想先从哪件事开始呢？','第一幕 · 相遇',[['先认识一下你','name'],['带我看看第一层','tour'],['看看你今天的外观','outfit'],['你刚才在发什么呆？','tease']],'neutral'],
  name:['叫我柯妮丝就好。名字虽然有点长，不过如果是你来叫，我会觉得它很好听。','第一幕 · 认识',[['你看起来很温柔','warm'],['你平时喜欢什么？','likes'],['继续逛逛这里','tour']],'happy'],
  tour:['这里是第一层，像一扇慢慢推开的门。可以先在这里聊天、看内容，再一步一步走进后面的世界。','第一幕 · 探索',[['那我先留在这里陪你','likes'],['还有小游戏吗？','game'],['想听听你的故事','story']],'neutral'],
  tease:['因为风从裙摆和袜边轻轻掠过去的时候，我会下意识缩一下。别笑我呀，我只是……对那种轻飘飘的触感特别敏感。','第一幕 · 小秘密',[['原来你这么怕痒？','ticklish'],['我不会故意捉弄你的','warm'],['那我换个话题','likes']],'shy'],
  ticklish:['嗯……是有一点。像羽毛、书页边、或者谁突然靠近轻轻碰一下，我都会忍不住笑出来。所以别故意欺负我，好不好？','第二幕 · 轻声约定',[['我会很温柔的','warm'],['那你喜欢哪种外观？','outfit'],['继续听你说','story']],'shy'],
  likes:['我喜欢蓝色缎带、安静的窗边、还有有人愿意陪我把一句话慢慢说完。要是气氛很好，我也会忍不住笑得很快。','第二幕 · 闲聊',[['今天能够遇见你真好','warm'],['你刚才又笑了','tease2'],['看看你的外观','outfit']],'happy'],
  tease2:['你是不是发现了？只要被人用很轻的语气逗一逗，我就会先躲一下，然后又忍不住想笑。真是有点拿自己没办法。','第二幕 · 被看穿',[['这样很可爱','warm'],['继续讲故事吧','story'],['让我看看你的搭配','outfit']],'shy'],
  story:['如果把今天写成一个小故事，大概会是“风吹过书页，她努力装作镇定，却还是笑了出来”。听起来是不是有点像我？','第二幕 · 故事时间',[['确实很像你','warm'],['我想继续陪你聊天','likes'],['下次还能来找你吗？','end']],'happy'],
  game:['你现在看到的，就是第一层的小剧场啦。试着移动鼠标，我会看着你；如果轻轻点我一下……我大概会被吓到一下。','第二幕 · 小剧场',[['那我试试看','poke'],['先回到我们的话题','likes']],'surprised'],
  warm:['诶……突然这么认真地说，我会不好意思的。谢谢你愿意留下来陪我。','第二幕 · 心意',[['那就继续陪你一会儿','likes'],['下次再见','end']],'shy'],
  outfit:['这次我只留下了三套外观。你可以在上方菜单切换原图、白色裤袜和白色过膝袜。每一套都会让氛围有一点点不一样。','第二幕 · 外观',[['换成白色裤袜看看','pantyhose'],['换成白色过膝袜看看','overknee'],['保持原图默认','backOriginal']],'neutral'],
  pantyhose:['已经换成白色裤袜了。走动的时候，布料轻轻擦过脚踝，会让我更容易分神……不过今天先当作是小秘密。','第二幕 · 外观',[['再试试过膝袜','overknee'],['回到聊天','likes']],'happy'],
  overknee:['白色过膝袜也换好了。袜口轻轻贴在腿上的感觉，总会让我下意识注意到它的存在。','第二幕 · 外观',[['换回白色裤袜','pantyhose'],['继续聊天','likes']],'happy'],
  backOriginal:['还是保留原图吧。这样最像刚刚遇见你的那个我。','第二幕 · 外观',[['那我们继续聊','likes'],['想听你的故事','story']],'neutral'],
  poke:['呀——不要突然碰我啦。我真的会条件反射地缩起来……不过，只是这样轻轻打个招呼的话，我还是很高兴的。','第二幕 · 小互动',[['我只是想引起你的注意','warm'],['继续聊聊喜欢的东西','likes'],['下次再见','end']],'surprised'],
  end:['今天的相遇就先到这里吧。下次你再来第一层的时候，我会继续把故事讲给你听。','尾声 · 再会',[['重新开始','start'],['再听一个小秘密','tease']],'happy']
};
function setExpression(name){
  if(!expressionNames.includes(name)) name='neutral';
  currentExpr=name;
  exprSkin.src=`${expressionBase}${name}/${name}_skin.png`;
  exprEyeLeft.src=`${expressionBase}${name}/${name}_eye_left.png`;
  exprEyeRight.src=`${expressionBase}${name}/${name}_eye_right.png`;
  exprMouth.src=`${expressionBase}${name}/${name}_mouth.png`;
  art.classList.remove('neutral','happy','shy','sad','surprised','angry','blink');
  art.classList.add(name === 'blink' ? 'neutral' : name);
}
function setCostume(name){
  currentCostume=name;
  if(name==='tights'){
    wardrobeLeft.src=`${wardrobeBase}tights/tights_left.png`;
    wardrobeRight.src=`${wardrobeBase}tights/tights_right.png`;
  }else if(name==='overknee'){
    wardrobeLeft.src=`${wardrobeBase}overknee/overknee_left.png`;
    wardrobeRight.src=`${wardrobeBase}overknee/overknee_right.png`;
  }else{
    wardrobeLeft.src=''; wardrobeRight.src='';
  }
  $('costume').value=name;
  $('costumeNote').textContent=`当前外观：${costumeLabels[name]}。本页已完全替换为你的自制角色差分，并删除了旧版未包含的其他差分。`;
}
function setMood(m){setExpression(m)}
function say(){clearTimeout(talkTimer); art.classList.remove('react');void art.offsetWidth;art.classList.add('react');talkTimer=setTimeout(()=>art.classList.remove('react'),280)}
function show(id){const n=story[id]||story.start;current=id;text.textContent=n[0];chapter.textContent=n[1];setMood(n[3]);choices.replaceChildren();for(const [label,to] of n[2]){const b=document.createElement('button');b.type='button';b.textContent='♡  '+label;b.addEventListener('click',()=>{if(to==='pantyhose')setCostume('tights');if(to==='overknee')setCostume('overknee');if(to==='backOriginal')setCostume('original');show(to)});choices.append(b)}say()}
function blink(){const prev=currentExpr;setExpression('blink');setTimeout(()=>setExpression(prev),150);clearTimeout(blinkTimer);blinkTimer=setTimeout(blink,3200+Math.random()*3000)}
$('costume').addEventListener('change',()=>{setCostume($('costume').value);setExpression('happy');say();text.textContent=`已经换成${costumeLabels[$('costume').value]}了。你觉得现在的氛围怎么样？`;chapter.textContent='自由互动 · 外观切换';choices.replaceChildren();[['聊聊这套外观','outfit'],['继续刚才的话题',current]].forEach(([label,to])=>{const b=document.createElement('button');b.type='button';b.textContent='♡  '+label;b.addEventListener('click',()=>show(to));choices.append(b)})});
scene.addEventListener('pointermove',e=>{if(!follow||e.pointerType==='touch')return;const r=scene.getBoundingClientRect(),x=Math.max(-1,Math.min(1,(e.clientX-r.left-r.width/2)/(r.width/2))),y=Math.max(-1,Math.min(1,(e.clientY-r.top-r.height/2)/(r.height/2)));art.style.setProperty('--gx',(x*3.2).toFixed(2)+'px');art.style.setProperty('--gy',(y*2.2).toFixed(2)+'px');art.style.setProperty('--tilt',(x*.8).toFixed(2)+'deg');art.style.setProperty('--mx',(x*5.5).toFixed(2)+'px')});
scene.addEventListener('pointerleave',()=>{art.style.setProperty('--gx','0px');art.style.setProperty('--gy','0px');art.style.setProperty('--tilt','0deg');art.style.setProperty('--mx','0px')});
$('talkHit').addEventListener('click',()=>{clicks++;say();const touchLines=[
  ['呀——别突然碰我，我真的会缩一下。', 'surprised'],
  ['你是不是故意挑这种轻轻的打招呼方式呀？我会很容易笑出来的。', 'shy'],
  ['风从袜边掠过去都能让我分神，更别说你突然碰一下了。', 'happy'],
  ['好啦，我知道你是在和我打招呼……只是我确实很怕痒。', 'shy']
];
const [line,mood]=touchLines[(clicks-1)%touchLines.length];setExpression(mood);text.textContent=line;chapter.textContent='自由互动 · 第 '+clicks+' 次招呼';choices.replaceChildren();[['继续刚才的话题',current],['聊聊你的小秘密','tease']].forEach(([label,to])=>{const b=document.createElement('button');b.type='button';b.textContent='♡  '+label;b.addEventListener('click',()=>show(to));choices.append(b)})});
$('follow').addEventListener('click',()=>{follow=!follow;$('follow').textContent=follow?'关闭目光跟随':'开启目光跟随';$('follow').setAttribute('aria-pressed',String(follow));if(!follow){art.style.setProperty('--gx','0px');art.style.setProperty('--gy','0px');art.style.setProperty('--tilt','0deg');art.style.setProperty('--mx','0px')}});
$('view').addEventListener('click',()=>{const full=scene.classList.toggle('full');$('view').textContent=full?'返回半身':'查看全身';$('view').setAttribute('aria-pressed',String(full))});
$('restart').addEventListener('click',()=>{clicks=0;setCostume('original');scene.classList.remove('full');$('view').textContent='查看全身';$('view').setAttribute('aria-pressed','false');show('start')});
setCostume('original');show('start');blinkTimer=setTimeout(blink,1800);
})();
</script>
</body>
</html>
