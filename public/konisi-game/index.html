<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>柯妮丝的午后 · 动作互动</title><link rel="stylesheet" href="character.css?v=20260930d"><script src="models.js?v=20260930d" defer></script><script src="character.js?v=20260930d" defer></script></head>
<body data-pose="standing"><main class="shell">
<header class="topbar"><div><h1>柯妮丝的午后</h1><p class="subtitle">雪糕少女汉化组 · Level 1</p></div></header>
<section class="interaction" aria-label="柯妮丝互动场景">
<div class="character-pane" id="scene"><canvas class="stage" id="character" aria-hidden="true"></canvas><img class="static-preview" id="fallback" alt="柯妮丝当前穿搭"><span class="status" id="appearance">原装</span><span class="scene-note">移动鼠标，她会看向你</span><div class="loading" id="loading" role="status"><span id="loadingText">正在准备角色…</span><button type="button" id="retry" hidden>重新加载</button></div></div>
<aside class="control-panel" aria-label="互动选项">
<div class="settings"><label for="costume">穿搭</label><select id="costume"><option value="original">原装</option><option value="tights">白色裤袜</option><option value="overknee">过膝白丝</option></select><button id="view" type="button" aria-pressed="false">查看半身</button><button id="follow" type="button" aria-pressed="true">关闭目光跟随</button><button id="motion" type="button" aria-pressed="true">暂停动作</button></div>
<div class="action-box"><h2>和柯妮丝互动</h2><p>选择一个动作，她会作出不同反应。</p><div class="action-grid"><button type="button" data-action="pat">摸摸头</button><button type="button" data-action="poke">戳一戳</button><button type="button" data-action="pinch">捏一捏</button><button type="button" data-action="rub">揉一揉</button></div></div>
<section class="dialogue-wrap" aria-label="动作回应"><div class="speaker" id="speaker">互动提示</div><p class="dialogue" id="dialogue" aria-live="polite">选择右侧动作，看看柯妮丝的反应。</p></section>
</aside></section><footer class="bottom"><span>3 种穿搭 · 4 种动作互动</span><span id="renderNote">静置时会随机轻抖</span></footer>
</main></body></html>
