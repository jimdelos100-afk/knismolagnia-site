<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light">
<title>柯妮丝的午后 · 互动 Galgame</title>
<style>
:root{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:#43516e;background:#f2eff9;--pink:#d973ae;--blue:#648ebd;--line:#e3c8df}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 5%,#ffeff9,transparent 54%),linear-gradient(150deg,#e8f2ff,#faf1fa);padding:clamp(8px,2.4vw,28px)}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #5687c5;outline-offset:3px}.shell{max-width:1100px;margin:auto;background:#fffafa;border:1px solid #e6d3e3;border-radius:20px;box-shadow:0 15px 48px #41446524;overflow:hidden}.topbar{background:linear-gradient(96deg,#fde3ef,#dceaff);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-weight:800;font-size:clamp(18px,2.5vw,24px);color:#644d76}.subtitle{color:#697d9d;font-size:12px;margin-top:3px}.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.toolbar button,.toolbar select{border:1px solid #bfb9d9;background:#fffefd;border-radius:9px;padding:8px 11px;font-size:13px;color:#566282}.toolbar button[aria-pressed=true]{background:#d9e9ff}.scene{height:clamp(410px,58vw,590px);position:relative;overflow:hidden;background:linear-gradient(176deg,#c6dfff,#f6e1f6 72%,#f8d6e9);touch-action:pan-y}.scene::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 75% 15%,#ffffff99,transparent 38%),linear-gradient(105deg,transparent 45%,#ffffff40 46%,transparent 49%);pointer-events:none}.scene::after{content:"";position:absolute;inset:auto 0 0;height:21%;background:linear-gradient(transparent,#b594c530);pointer-events:none}.float{position:absolute;background:#ffffffa0;border-radius:70px;filter:blur(1px);animation:drift 13s ease-in-out infinite alternate;pointer-events:none}.f1{width:160px;height:40px;left:4%;top:14%}.f2{width:110px;height:26px;right:8%;top:28%;animation-delay:-5s}.scene-label{position:absolute;z-index:5;top:13px;left:13px;border-radius:99px;padding:7px 12px;background:#ffffffbd;color:#5e6b90;font-size:12px}.hint{position:absolute;z-index:5;top:13px;right:13px;border-radius:8px;padding:7px 10px;background:#ffffffc7;color:#5e6b90;font-size:12px}.character{position:absolute;left:50%;top:-4%;height:174%;width:auto;max-width:none;transform:translateX(-50%) translateY(var(--step,0px)) rotate(var(--tilt,0deg));transform-origin:50% 23%;transition:transform .22s ease-out;animation:breathe 4.7s ease-in-out infinite;user-select:none;will-change:transform}.character img{display:block;height:100%;width:auto;pointer-events:none;-webkit-user-drag:none}.character .expressions{position:absolute;inset:0;pointer-events:none}.character .eyes{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}.eye-dot{fill:#543e98;opacity:.75;filter:drop-shadow(0 0 2px #e4dfff);transform:translate(var(--gx,0px),var(--gy,0px));transition:transform .15s ease-out}.eye-spark{fill:white;opacity:.87;transform:translate(var(--gx,0px),var(--gy,0px));transition:transform .15s ease-out}.lid{fill:#fce6dd;stroke:#9c6079;stroke-width:2;opacity:0;transition:opacity .11s}.character.blink .lid{opacity:.98}.character.blink .eye-dot,.character.blink .eye-spark{opacity:0}.character.react{--step:-8px;--tilt:1.1deg}.character.shy{--tilt:-1.8deg}.character.happy{--step:-5px}.hit{position:absolute;z-index:4;left:30%;width:40%;top:2%;height:75%;background:transparent;border:0;color:transparent;cursor:pointer}.hit:focus-visible{outline:3px dashed #e386bc;outline-offset:-3px}.scene.full .character{height:98%;top:1%}.scene.full .hit{left:32%;width:36%;height:96%}.scene.full .hint{top:auto;bottom:12px}.dialogue-wrap{position:relative;border-top:3px solid #e7bad6;padding:17px clamp(13px,3vw,25px) 22px;background:linear-gradient(125deg,#fff,#fff5fb);min-height:210px}.speaker{position:absolute;top:-18px;left:20px;border:1px solid #eabbd7;border-radius:11px 11px 4px 4px;background:#fff;padding:6px 15px;font-weight:800;color:#a54c8b;box-shadow:0 3px 12px #9e4b7c21}.dialogue{font-size:clamp(15px,2vw,19px);line-height:1.8;min-height:66px;margin:19px 0 13px;white-space:pre-line}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.choices button{min-height:44px;text-align:left;background:#fff;border:1px solid #e5bed5;border-radius:10px;padding:8px 12px;color:#624d75}.choices button:hover{background:#ffe8f3}.bottom{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;color:#707c97;padding:10px 16px;border-top:1px solid #f1e5f1;background:#fbfaff}.costume-note{margin:0;padding:6px 15px;color:#697b93;background:#f4f7ff;font-size:12px}.screen-reader{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:610px){body{padding:0}.shell{border-radius:0}.choices{grid-template-columns:1fr}.scene{height:440px}.character{height:152%;top:-1%}.hit{left:18%;width:64%}.scene.full .character{height:95%}.topbar{padding:12px}.hint{top:auto;bottom:10px}.toolbar select{max-width:160px}}@keyframes drift{to{transform:translate(32px,15px)}}@keyframes breathe{0%,100%{scale:1}50%{scale:1.003}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="shell"><header class="topbar"><div><div class="brand">柯妮丝的午后</div><div class="subtitle">雪糕少女汉化组 · Level 1 · 离线互动游戏</div></div><div class="toolbar"><label for="costume">换装 <span class="screen-reader">袜子差分</span></label><select id="costume"><option value="00_原画默认">默认款</option><option value="01_无袜基础">基础款</option><option value="02_白色裤袜">白色裤袜</option><option value="03_纯白过膝袜">纯白过膝袜</option><option value="04_花边过膝袜">花边过膝袜</option><option value="05_花边蝴蝶结过膝袜">花边蝴蝶结过膝袜</option><option value="06_白色短袜">白色短袜</option><option value="07_白色荷叶边短袜">白色荷叶边短袜</option><option value="08_蓝白配色袜">蓝白配色袜</option></select><button id="view" type="button" aria-pressed="false">查看全身</button><button id="follow" type="button" aria-pressed="true">关闭目光跟随</button><button id="restart" type="button">重开故事</button></div></header>
<section class="scene" id="scene" aria-label="柯妮丝互动场景"><span class="float f1"></span><span class="float f2"></span><div class="scene-label">午后 · 初次相遇</div><div class="hint">移动鼠标 · 点击角色 · 选择回应</div><div class="character" id="characterArt"><img id="characterImage" src="素材/服饰差分/00_原画默认.png" alt="柯妮丝的全身立绘，在舞台中裁切展示" draggable="false"><div class="expressions"><svg class="eyes" viewBox="0 0 1024 1536" aria-hidden="true"><defs><clipPath id="leftEye"><ellipse cx="511" cy="207" rx="10.2" ry="11.8"/></clipPath><clipPath id="rightEye"><ellipse cx="581" cy="240" rx="9.5" ry="10.3"/></clipPath></defs><g clip-path="url(#leftEye)"><ellipse class="eye-dot" cx="511" cy="210" rx="4.2" ry="5.4"/><circle class="eye-spark" cx="510" cy="207" r="1.3"/></g><g clip-path="url(#rightEye)"><ellipse class="eye-dot" cx="580" cy="241" rx="3.7" ry="4.4"/><circle class="eye-spark" cx="579" cy="238" r="1.2"/></g><path class="lid" d="M490 206 Q509 188 531 207 Q512 214 490 206Z"/><path class="lid" d="M562 238 Q581 224 602 239 Q581 247 562 238Z"/></svg></div></div><button type="button" class="hit" id="talkHit" aria-label="点击角色并与柯妮丝互动">与柯妮丝交谈</button></section>
<section class="dialogue-wrap" aria-label="对话区域"><div class="speaker" id="speaker">柯妮丝</div><p class="dialogue" id="dialogue" aria-live="polite"></p><div class="choices" id="choices"></div></section><p class="costume-note" id="costumeNote">换装已加载；默认半身画面会裁掉小腿，点击「查看全身」可查看全部袜子差分。</p><footer class="bottom"><span id="chapter">第一幕 · 相遇</span><span>完全离线 · 无需登录 · 不调用 Supabase · 原画完整保留</span></footer></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id); const scene=$('scene'),art=$('characterArt'),image=$('characterImage'),text=$('dialogue'),choices=$('choices'),chapter=$('chapter');
const story={
start:['咦？欢迎来到这里。我是柯妮丝·摩拉·戈妮娅。今天想和我聊些什么呢？','第一幕 · 相遇',[['你叫什么名字？','name'],['带我参观这里','tour'],['想看看你的装扮','outfit'],['只是路过一下','pass']],'normal'],
name:['柯妮丝·摩拉·戈妮娅。这个名字有一点长吧？叫我柯妮丝就好。','第一幕 · 认识',[['很高兴认识你','warm'],['你平时喜欢什么？','likes'],['继续参观','tour']],'happy'],
tour:['这是雪糕少女汉化组的第一层。你可以从这里了解我们，也可以慢慢走进之后的六层小世界。','第一幕 · 探索',[['我先留在这里聊天','likes'],['这里还有别的小游戏吗？','game'],['想听你的故事','story']],'normal'],
pass:['只是路过也没有关系呀。午后的阳光正好，坐下来歇一会儿吧。','第一幕 · 偶遇',[['那就聊一会儿','likes'],['介绍一下你自己','name']],'shy'],
likes:['我喜欢蓝色缎带、安静的午后，还有有人愿意认真听我说话。你呢？','第二幕 · 闲聊',[['我也喜欢有趣的故事','story'],['今天能够遇见你真好','warm'],['看看你的装扮','outfit']],'happy'],
story:['如果把今天写成故事，这一页的标题大概是“第一次相遇”。下次见面，你愿意讲自己的故事给我听吗？','第二幕 · 约定',[['好呀，约定好了','end'],['还想再聊一会儿','likes']],'normal'],
game:['你现在看到的，就是第一层的小游戏啦。试着移动鼠标，看我有没有在认真听你说话？','第二幕 · 小游戏',[['我来试试看','poke'],['认识一下彼此','name']],'happy'],
warm:['诶……突然这么说，我会有一点不好意思。谢谢你愿意来这里。','第二幕 · 心意',[['下次再见','end'],['继续聊聊','likes']],'shy'],
outfit:['今天想看哪一种搭配呢？可以在上方的“换装”菜单里切换。记得切换到全身视角才看得到袜子哦。','第二幕 · 装扮',[['白色裤袜很好看','pantyhose'],['试试过膝袜','overknee'],['回到我们的话题','likes']],'normal'],
pantyhose:['已经换好啦。风格是不是和刚才有一点不同？','第二幕 · 装扮',[['换另一种看看','outfit'],['继续参观','tour']],'happy'],
  poke:['我听见啦，不用一直戳我。有什么新话题吗？','第二幕 · 小互动',[['聊聊喜欢的东西','likes'],['下次再见','end']],'shy'],
end:['今天的相遇就先到这里吧。下次再来第一层找我，约好了哦。','尾声 · 再会',[['重新开始','start'],['再讲一个故事','story']],'happy']
};
// Keep all story IDs simple so this standalone file works without a build tool.
story.overknee=['过膝袜也换好啦。这个颜色很适合今天的蓝色缎带。','第二幕 · 装扮',[['换另一种看看','outfit'],['继续聊天','likes']],'happy'];
let current='start',clicks=0,follow=true,blinkTimer=null,actTimer=null,talkTimer=null;
function setMood(m){art.classList.remove('shy','happy');if(m==='shy'||m==='happy')art.classList.add(m)}
function show(id){const n=story[id]||story.start;current=id; text.textContent=n[0];chapter.textContent=n[1];setMood(n[3]);choices.replaceChildren();for(const [label,to] of n[2]){const b=document.createElement('button');b.type='button';b.textContent='♡  '+label;b.addEventListener('click',()=>{if(to==='pantyhose')setCostume('02_白色裤袜');if(to==='overknee')setCostume('05_花边蝴蝶结过膝袜');show(to)});choices.append(b)}say()}
function say(){clearTimeout(talkTimer); art.classList.remove('react');void art.offsetWidth;art.classList.add('react');talkTimer=setTimeout(()=>art.classList.remove('react'),280)}
function blink(){art.classList.add('blink');setTimeout(()=>art.classList.remove('blink'),130);clearTimeout(blinkTimer);blinkTimer=setTimeout(blink,3300+Math.random()*3200)}
function setCostume(name){const safe=Array.from($('costume').options).some(o=>o.value===name)?name:'00_原画默认';image.src='素材/服饰差分/'+safe+'.png';$('costume').value=safe;$('costumeNote').textContent='当前外观：'+$('costume').selectedOptions[0].text+'。原始全身立绘仍保存在「素材/角色完整立绘.png」。'}
$('costume').addEventListener('change',()=>{setCostume($('costume').value);setMood('happy');say();text.textContent='这样搭配怎么样？我自己也很喜欢蓝白色。';chapter.textContent='自由互动 · 服饰差分'});
scene.addEventListener('pointermove',e=>{if(!follow||e.pointerType==='touch')return;const r=scene.getBoundingClientRect(),x=Math.max(-1,Math.min(1,(e.clientX-r.left-r.width/2)/(r.width/2))),y=Math.max(-1,Math.min(1,(e.clientY-r.top-r.height/2)/(r.height/2)));art.style.setProperty('--gx',(x*3.0).toFixed(2)+'px');art.style.setProperty('--gy',(y*2.2).toFixed(2)+'px');art.style.setProperty('--tilt',(x*.7).toFixed(2)+'deg')});
scene.addEventListener('pointerleave',()=>{art.style.setProperty('--gx','0px');art.style.setProperty('--gy','0px');art.style.setProperty('--tilt','0deg')});
$('talkHit').addEventListener('click',()=>{clicks++;say();setMood(clicks%3===0?'shy':'happy');const lines=['呀，是在叫我吗？','我在认真听哦。','嘻嘻，你好呀！','有什么想对我说的吗？'];text.textContent=lines[(clicks-1)%lines.length];chapter.textContent='自由互动 · 第 '+clicks+' 次打招呼';choices.replaceChildren();const b=document.createElement('button');b.textContent='♡ 继续刚才的话题';b.addEventListener('click',()=>show(current));choices.append(b)});
$('follow').addEventListener('click',()=>{follow=!follow;$('follow').textContent=follow?'关闭目光跟随':'开启目光跟随';$('follow').setAttribute('aria-pressed',String(follow));if(!follow){art.style.setProperty('--gx','0px');art.style.setProperty('--gy','0px');art.style.setProperty('--tilt','0deg')}});
$('view').addEventListener('click',()=>{const full=scene.classList.toggle('full');$('view').textContent=full?'返回半身':'查看全身';$('view').setAttribute('aria-pressed',String(full))});
$('restart').addEventListener('click',()=>{clicks=0;setCostume('00_原画默认');scene.classList.remove('full');$('view').textContent='查看全身';$('view').setAttribute('aria-pressed','false');show('start')});
show('start');blinkTimer=setTimeout(blink,1900);
})();
</script>
</body></html>
