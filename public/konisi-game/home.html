<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>柯妮丝的午后 · 动作互动</title><link rel="stylesheet" href="character.css?v=20261010f"><script src="models.js?v=20261010f" defer></script><script src="character.js?v=20261010f" defer></script></head>
<body data-pose="standing" data-mode="companion"><main class="shell">
<header class="topbar"><div><h1>柯妮丝的午后</h1><p class="subtitle">雪糕少女汉化组 · 首页</p></div></header>
<section class="interaction" aria-label="柯妮丝互动场景">
<div class="character-pane" id="scene" tabindex="0" role="button" aria-label="摸摸柯妮丝的头"><canvas class="stage" id="character" aria-hidden="true"></canvas><img class="static-preview" id="fallback" alt="柯妮丝当前穿搭"><div class="zoom-tools" aria-label="角色缩放"><button type="button" id="zoomOut" aria-label="缩小角色">−</button><span id="zoomLevel">100%</span><button type="button" id="zoomIn" aria-label="放大角色">＋</button></div><span class="status" id="appearance">原装</span><span class="scene-note">点击角色 · 摸摸头</span><div class="loading" id="loading" role="status"><span id="loadingText">正在准备角色…</span><button type="button" id="retry" hidden>重新加载</button></div></div>
<aside class="control-panel" aria-label="互动选项">
<div class="settings" hidden><label for="costume">穿搭</label><select id="costume"><option value="original">原装</option><option value="tights">白色裤袜</option><option value="overknee">过膝白丝</option></select><button id="reset" type="button">回到初始位置</button><button id="follow" type="button" aria-pressed="true">关闭目光跟随</button><button id="motion" type="button" aria-pressed="true">暂停动作</button></div>
<section class="dialogue-wrap" aria-label="动作回应"><div class="speaker" id="speaker">互动提示</div><p class="dialogue" id="dialogue" aria-live="polite">鼠标移过来，我会看着你。点击我，摸摸头吧。</p></section>
</aside></section><footer class="bottom"><span>3 种穿搭 · 4 种动作互动</span><span id="renderNote">静置时会随机轻抖</span></footer>
</main></body></html>
